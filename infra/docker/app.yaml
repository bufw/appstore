name: docker
title: Docker
version: [28.5.1]
license: Apache-2.0
homepage: https://www.docker.com
platforms:
  - linux/amd64
  - linux/arm64
category: infra
description: Docker is a platform for building, shipping and running containers.
allow_multiple_instances: 'no'
tags: [docker, container, infra]
author: zap
organization_name: zap
scripts:
  install: install.sh
  uninstall: uninstall.sh
options:
  install:
    intro: >-
      Installs Docker Engine through the official convenience script (get.docker.com),
      which detects your distribution and installs via its package manager, then enables
      and starts the service. Re-running it is safe — zap's upgrade flow runs uninstall
      first, then install.
    items:
      - name: INSTALL_RUNTIME
        label: Runtime
        type: select
        default: docker
        desc: Docker is the common choice; Podman has no daemon and is rootless, the panel only allocates container capabilities to regular users under Podman (Docker runs containers as root without user isolation)
        choices:
          - label: Docker
            value: docker
          - label: Podman(rootless)
            value: podman
      - name: INSTALL_MIRROR
        label: Mirror Source
        type: select
        default: official
        desc: The official source may be slow in China, you can switch to Aliyun mirror for faster download
        choices:
          - label: get.docker.com
            value: official
          - label: Aliyun Mirror
            value: aliyun
      - name: INSTALL_CHANNEL
        label: Publish Channel
        type: select
        default: stable
        desc: stable channel is recommended for production
        choices:
          - label: stable
            value: stable
      - name: REGISTRY_MIRROR
        label: Registry Mirror
        type: string
        default: ''
        placeholder: https://docker.m.daocloud.io
        desc: writes to /etc/docker/daemon.json the registry-mirrors, leave empty to not configure
      - name: DATA_ROOT
        label: Data Root
        type: string
        default: /var/lib/docker
        desc: Default location for Docker images, containers, and volumes. 
      - name: ENABLE_SERVICE
        label: Service Autostart
        type: bool
        default: true
      - name: JOIN_DOCKER_GROUP
        label: Add Users to Docker Group
        type: string
        default: ''
        placeholder: user1,user2
        desc: add users to the docker group, without sudo the can run docker commands
  uninstall:
    intro: >-
      Stops and disables the Docker service, removes the packages installed by the
      convenience script, and cleans up configuration. Image and container data under
      the data root is KEPT unless you explicitly purge it below.
    items:
      - name: PURGE_DATA
        label: Purge Data Root
        type: bool
        default: false
        desc: If checked, /var/lib/docker (all images, containers, and volumes) and /var/lib/containerd will be deleted, which cannot be recovered; default is to keep them.
      - name: BACKUP_CONFIG
        label: Backup Config
        type: bool
        default: true
        desc: If checked, /etc/docker/daemon.json is copied to /root/zap_bak/docker/ before removal.
