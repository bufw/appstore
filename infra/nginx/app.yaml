name: nginx
title: Nginx
version: [1.31.5]
license: Apache-2.0
homepage: https://nginx.org
platforms:
  - linux/amd64
  - linux/arm64
category: infra
description: is an HTTP web server, reverse proxy, content cache, load balancer, TCP/UDP proxy server, and mail proxy server.
icon: nginx.png
allow_multiple_instances: 'no'
tags: [webserver]
author: zap
organization_name : zap
actions:
  build: Build
scripts:
  install: install.sh
options:
  build:
    - name: OPENSSL_VERSION
      label: OpenSSL Version
      type: select
      default: 3.5.6
      desc: Specify the OpenSSL version
      choices:
        - label: 3.0.16
          value: 3.0.16
        - label: 3.1.5
          value: 3.1.5
        - label: 3.5.6
          value: 3.5.6
        - label: 3.6.3
          value: 3.6.3
        - label: 4.0.1
          value: 4.0.1
    - name: MODSECURITY
      label: ModSecurity(WAF)
      type: bool
      default: false
      desc: Compile libmodsecurity and ModSecurity dynamic module, and deploy OWASP CRS rule set (by default, only logging without blocking). The dynamic module can only be added during compilation, and cannot be added later to an already installed nginx
