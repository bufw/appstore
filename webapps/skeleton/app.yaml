name: skeleton
title: Web 应用骨架
version: [1.0.0]
category: webapps
description: 最小可运行的 webapps 应用骨架。演示面板自动建站 + 建库，以及一个完整的 PHP 前端表单 ↔ 后端处理（留言板）示例。复制本目录即可作为你自己站点应用的起点。
tags: [skeleton, demo, php]
scope: site
run_as: user
roles: [admin, user, reseller, demo]
allow_multiple_instances: 'yes'
# 执行前注入环境变量
#   SITE_ID SITE_DOMAIN SITE_ROOT SITE_OWNER SITE_LINUX_USER PHP_INSTANCE PHP_FPM_SOCK
#   DB_NAME DB_USER DB_PASS DB_HOST DB_PORT DB_CHARSET DB_USER_HOST
# 密码不进 options.env / info.yaml，只在脚本进程与 provision.json（0600）出现。
provision:
  site:
    mode: create              #  create : 自动创建站点, require 则要求先建站
    domain_option: SITE_DOMAIN
    rewrite: none
  database:
    name: app                  # 数据库名称 = 用户前缀 + app（重名自动 app_2…）
    charset: utf8mb4
scripts:
  install: install.sh
  uninstall: uninstall.sh
options:
  install:
    intro: >-
      面板会为 SITE_DOMAIN 自动建好 PHP 站点与专用数据库，并把连接信息注入脚本环境。
      安装脚本以站点 Linux 账号身份把程序写入站点根目录（SITE_ROOT）。
    items:
      - name: SITE_DOMAIN
        label: 站点域名
        type: string
        required: true
        placeholder: app.example.com
        desc: 站点不存在时面板会自动创建（PHP 取面板默认版本）
