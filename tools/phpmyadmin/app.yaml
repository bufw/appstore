name: phpmyadmin
title: phpMyAdmin
version: [5.2.3]
category: tools
description: A PHP tool for managing MySQL / MariaDB from the browser. The panel hosts it under the /webapps/phpmyadmin/ path and provides authentication. It is a panel-level system management tool and does not create a separate user site.
tags: [phpmyadmin, mysql, mariadb, tool]
# Panel-level tool: installed system-wide; not placed in a user site directory
scope: panel
allow_multiple_instances: 'no'
dependencies:
  php: '>=7.2'
scripts:
  install: install.sh
  uninstall: uninstall.sh
  upgrade: upgrade.sh
options:
  install:
    intro: >-
      phpMyAdmin will be installed to /usr/local/apps/phpmyadmin and exposed through the panel's /webapps/phpmyadmin/ path.
      The database credentials are NOT stored here: phpMyAdmin uses cookie auth, so you
      log in with your existing MySQL / MariaDB user and password in the browser.
    items:
      - name: DB_HOST
        label: Database Host
        type: string
        default: localhost
        desc: The managed MySQL / MariaDB host (defaults to localhost locally; or an internal IP)
      - name: DB_PORT
        label: Database Port
        type: number
        default: 3306
        desc: The managed database port (MySQL / MariaDB default 3306)
  upgrade:
    intro: >-
      Upgrade replaces the program files with the target version and keeps your
      config.inc.php (blowfish secret and server settings), so logins stay valid.
